appId: com.oines.astral
productName: Astral
directories:
  output: release
files:
  - out/**/*
  - package.json
publish:
  provider: generic
  url: https://github.com/oines/astral/releases/latest/download/
electronUpdaterCompatibility: '>= 2.16'
extraResources:
  - from: ../../dist/bin
    to: bin
    filter:
      - astral-*
      - checksums.txt
      - THIRD_PARTY_NOTICES.txt
      - LICENSE.txt
  - from: resources
    to: .
    filter:
      - trayTemplate*.png
      - icon*.png
      - icon.ico
      - app-update.yml
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: null
  extendInfo:
    NSHumanReadableCopyright: Astral contributors
dmg:
  title: Astral
win:
  icon: resources/icon.ico
  executableName: Astral
  requestedExecutionLevel: asInvoker
  target:
    - nsis
    - zip
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  buildUniversalInstaller: false
  differentialPackage: false
  deleteAppDataOnUninstall: false
linux:
  icon: resources/icon.png
  executableName: astral
  category: Utility
  target:
    - AppImage
    - deb
artifactName: Astral-${version}-${os}-${arch}.${ext}

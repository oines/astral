<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astral — 字标重绘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f0eff4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#342d4c}main{width:1200px;min-height:850px;padding:35px 36px 32px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}h1{font-size:22px;letter-spacing:-.5px;margin:0;font-weight:600}header span{font-size:13px;color:#827a92;letter-spacing:1.2px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border-radius:18px;overflow:hidden;position:relative}.panel-top{padding:22px 24px;display:flex;justify-content:space-between;align-items:baseline}h2{margin:0;font-size:15px;font-weight:550}.tag{font-size:12px;color:#8c849b}.logo{height:173px;display:flex;align-items:center;justify-content:center;padding-bottom:26px}.logo img{width:450px;height:auto}.new{box-shadow:inset 0 0 0 1px #d8d0e7}.note{border-top:1px solid #f0edf5;padding:17px 24px;font-size:13px;color:#88808f;letter-spacing:.1px}.dark{background:#191822;color:#f3effb;border-radius:18px;margin-top:20px;height:245px;position:relative}.dark .tag{color:#8f879e}.dark .logo{height:173px;padding-bottom:27px}.dark .logo img{width:610px}.sizes{display:flex;align-items:center;gap:50px;background:#fff;border-radius:18px;margin-top:20px;padding:22px 26px;min-height:123px}.sizes .intro{width:155px}.sizes .intro strong{font-size:14px;font-weight:550;display:block;margin-bottom:7px}.sizes .intro span{font-size:12px;color:#91879d}.sample{display:flex;flex-direction:column;align-items:center;gap:7px}.sample img{height:auto}.sample span{font-size:11px;color:#92889f}footer{font-size:12px;color:#93899c;display:flex;justify-content:space-between;margin-top:16px}
</style>
</head>
<body>
<main>
<header><h1>Astral · 字标重绘</h1><span>CUSTOM SVG WORDMARK / 01</span></header>
<section class="comparison">
<article class="panel"><div class="panel-top"><h2>现有版本</h2><span class="tag">CURRENT</span></div><div class="logo"><img src="astral-lockup-before.svg" alt="现有 Astral 图文标志"></div><div class="note">粗字重 · 双层 a · 方正端点</div></article>
<article class="panel new"><div class="panel-top"><h2>重绘版本</h2><span class="tag">REDESIGNED</span></div><div class="logo"><img src="astral-lockup.svg" alt="重绘后的 Astral 图文标志"></div><div class="note">柔化转角 · 单层 a · 上扬的 A 横笔</div></article>
</section>
<section class="dark"><div class="panel-top"><h2>深色背景</h2><span class="tag">NEW WORDMARK / INVERSE</span></div><div class="logo"><img src="astral-lockup-inverse.svg" alt="深色背景中的新版 Astral 图文标志"></div></section>
<section class="sizes"><div class="intro"><strong>实际尺寸</strong><span>检查缩小后的字形与间距</span></div><div class="sample"><img src="astral-lockup.svg" width="130" alt="130 像素新版标志"><span>130 px</span></div><div class="sample"><img src="astral-lockup.svg" width="156" alt="156 像素新版标志"><span>156 px</span></div><div class="sample"><img src="astral-lockup.svg" width="208" alt="208 像素新版标志"><span>208 px</span></div></section>
<footer><span>A / s / t / r / a / l — 六个字母独立绘制</span><span>纯矢量路径 · 透明背景 · 无字体依赖</span></footer>
</main>
</body></html>

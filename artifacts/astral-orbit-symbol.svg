<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="35 13 233 233" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Astral · Orbit — Transparent</title>
  <desc id="desc">奶油白与淡紫色的星球、流动的光环和两颗星光。独立矢量 logo，采用平滑路径、珍珠渐变和柔和光晕。</desc>
  <defs>
    <radialGradient id="planetAura" cx="0" cy="0" r="1" gradientTransform="translate(155 137) rotate(90) scale(74 76)" gradientUnits="userSpaceOnUse">
      <stop offset=".50" stop-color="#d3c2ff" stop-opacity=".17" />
      <stop offset=".69" stop-color="#bc9eff" stop-opacity=".17" />
      <stop offset=".85" stop-color="#9278e9" stop-opacity=".065" />
      <stop offset="1" stop-color="#8b7ae6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="planetBase" x1="171" y1="97" x2="129" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf1" />
      <stop offset=".31" stop-color="#fcf5ed" />
      <stop offset=".51" stop-color="#eee6f2" />
      <stop offset=".72" stop-color="#d2c8f8" />
      <stop offset="1" stop-color="#b6aef6" />
    </linearGradient>
    <radialGradient id="planetWarmth" cx="0" cy="0" r="1" gradientTransform="translate(171 110) rotate(116) scale(68 67)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8ed" />
      <stop offset=".48" stop-color="#fff7ed" stop-opacity=".91" />
      <stop offset=".76" stop-color="#fff5ec" stop-opacity=".36" />
      <stop offset="1" stop-color="#fff6ed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="planetLavender" cx="0" cy="0" r="1" gradientTransform="translate(103 152) rotate(-12) scale(56 61)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b6adff" stop-opacity=".64" />
      <stop offset=".43" stop-color="#bfb4ff" stop-opacity=".39" />
      <stop offset="1" stop-color="#d8caff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="planetTopLight" cx="0" cy="0" r="1" gradientTransform="translate(159 89) rotate(86) scale(41 56)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf6" stop-opacity=".36" />
      <stop offset="1" stop-color="#fffdf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="planetRim" x1="124" y1="96" x2="183" y2="179" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f0ff" stop-opacity=".8" />
      <stop offset=".34" stop-color="#ede4ff" stop-opacity=".18" />
      <stop offset=".71" stop-color="#e4d9ff" stop-opacity=".26" />
      <stop offset="1" stop-color="#d2caff" stop-opacity=".67" />
    </linearGradient>
    <linearGradient id="ringBack" x1="86" y1="168" x2="236" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8272d6" stop-opacity=".78" />
      <stop offset=".28" stop-color="#7562c4" stop-opacity=".42" />
      <stop offset=".68" stop-color="#8074ba" stop-opacity=".42" />
      <stop offset="1" stop-color="#c8b7fb" />
    </linearGradient>
    <linearGradient id="ringFront" x1="75" y1="187" x2="236" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a490f0" />
      <stop offset=".20" stop-color="#c7b6ff" />
      <stop offset=".47" stop-color="#e5d8ff" />
      <stop offset=".73" stop-color="#fff7ed" />
      <stop offset=".89" stop-color="#fffdf4" />
      <stop offset="1" stop-color="#d9c9ff" />
    </linearGradient>
    <linearGradient id="ringCore" x1="77" y1="188" x2="223" y2="131" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5b4ff" stop-opacity=".35" />
      <stop offset=".44" stop-color="#eee5ff" stop-opacity=".76" />
      <stop offset=".83" stop-color="#fffdf1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".85" />
    </linearGradient>
    <linearGradient id="eyeInk" x1="149" y1="117" x2="144" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262b5e" />
      <stop offset=".52" stop-color="#1b214f" />
      <stop offset="1" stop-color="#11183f" />
    </linearGradient>
    <linearGradient id="goldStar" x1="80" y1="63" x2="99" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7cc" />
      <stop offset=".48" stop-color="#fff0b9" />
      <stop offset="1" stop-color="#f8e5a6" />
    </linearGradient>
    <linearGradient id="violetStar" x1="216" y1="182" x2="225" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0d5ff" />
      <stop offset=".54" stop-color="#c4b7f7" />
      <stop offset="1" stop-color="#a69cdd" />
    </linearGradient>
    <filter id="blur12" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="blur5" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="blur2" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2" />
    </filter>
    <filter id="blur1" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".8" />
    </filter>
    <filter id="softEdge" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".27" />
    </filter>
    <filter id="eyeEdge" x="-40%" y="-20%" width="180%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-.5" dy="0" stdDeviation=".65" flood-color="#fffdf4" flood-opacity=".78" />
    </filter>
    <rect id="tile" x="35" y="13" width="233" height="233" rx="54" />
    <path id="globe" d="M153.5 84.5C181.9 83.7 205.7 106.9 206.6 135.4C207.5 164 184.5 188.4 155.6 188.8C126.7 189.7 101.8 167.3 100.7 138.7C99.5 109.8 123.9 85.3 153.5 84.5Z" />
    <ellipse id="orbitBack" cx="157.325" cy="141.216" rx="94.794" ry="26.371" transform="rotate(-28.565 157.325 141.216)" />
    <path id="orbitFront" d="M241.526 99.864A94.794 26.371 -28.565 0 1 73.124 182.568" />
    <linearGradient id="orbitTaper" x1="73" y1="141" x2="242" y2="141" gradientUnits="userSpaceOnUse">
      <stop stop-color="black" />
      <stop offset=".06" stop-color="white" />
      <stop offset=".94" stop-color="white" />
      <stop offset="1" stop-color="black" />
    </linearGradient>
    <mask id="orbitMask" maskUnits="userSpaceOnUse" x="65" y="85" width="185" height="115">
      <path d="M65 85h185v115H65z" fill="url(#orbitTaper)" />
    </mask>
    <linearGradient id="planetBottom" x1="155" y1="146" x2="155" y2="189" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b7adfb" stop-opacity="0" />
      <stop offset=".55" stop-color="#b7adfb" stop-opacity=".17" />
      <stop offset="1" stop-color="#b7adfb" stop-opacity=".65" />
    </linearGradient>
    <path id="largeStar" d="M86.5 63.2C87.7 59.3 90.1 59.2 91.5 63L94 70C94.5 71.3 95.2 72.1 96.6 72.6L102.1 74.7C105.8 76.1 105.7 78.4 102.2 79.8L96.4 82C95 82.5 94.4 83.2 93.9 84.7L91.7 91C90.4 94.8 87.9 94.8 86.6 91.1L84.2 84.6C83.7 83.3 83 82.6 81.6 82.1L75.8 80C72.2 78.6 72.2 76.3 75.7 74.9L81.8 72.6C83.1 72.1 84 71.4 84.4 70Z" />
    <path id="smallStar" d="M220.6 179.6C221.1 179.3 221.6 183.5 223.4 185.6C224.7 187.1 227.3 187.8 229.2 188.6C230 189.2 225.6 189.9 224 191.5C222.4 193.1 221.6 196.4 221.1 198.1C220.6 199 220 194.8 218.3 192.6C216.7 190.6 213.8 190.1 212 189.4C210.9 188.8 215.5 188.1 217.1 186.7C219.2 184.9 220 181.2 220.6 179.6Z" />
    <clipPath id="tileClip">
      <use href="#tile" />
    </clipPath>
    <clipPath id="globeClip">
      <use href="#globe" />
    </clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <g id="logo">
      <!-- The yellow star throws a wide, very soft glow into the sky. -->
      <use href="#largeStar" fill="#ffdb8b" opacity=".31" filter="url(#blur12)" />
      <use href="#largeStar" fill="#ffdf9d" opacity=".45" filter="url(#blur5)" />
      <use href="#largeStar" fill="#fff0bd" opacity=".6" filter="url(#blur1)" />
      <use href="#largeStar" fill="url(#goldStar)" />
      <use href="#largeStar" stroke="#fff7d1" stroke-opacity=".55" stroke-width=".6" />
      <!-- Small points of light retain their subtly different sizes and colors. -->
      <g filter="url(#blur1)">
        <circle cx="221.2" cy="53.9" r="3.1" fill="#c1b8ff" opacity=".4" />
        <circle cx="186.4" cy="64.1" r="2.5" fill="#dad6ff" opacity=".4" />
        <circle cx="130.6" cy="63.8" r="1.9" fill="#ae9dec" opacity=".43" />
        <circle cx="69.6" cy="140.7" r="4.1" fill="#b9b6ee" opacity=".32" />
        <circle cx="237.5" cy="149.9" r="1.9" fill="#e8dbff" opacity=".42" />
        <circle cx="191.9" cy="206.4" r="2.9" fill="#ede5bd" opacity=".25" />
        <circle cx="107.8" cy="213.7" r="2.1" fill="#9c91ed" opacity=".4" />
      </g>
      <g>
        <circle cx="221.2" cy="53.9" r="2.75" fill="#f2efff" />
        <circle cx="220.7" cy="53.3" r="1.1" fill="#ffffff" opacity=".64" />
        <ellipse cx="186.4" cy="64.1" rx="2.15" ry="2.45" fill="#faf7ff" />
        <circle cx="130.6" cy="63.8" r="1.35" fill="#b9b0e8" />
        <circle cx="69.6" cy="140.7" r="3.65" fill="#f6f5e9" />
        <circle cx="237.5" cy="149.9" r="1.45" fill="#faf4ff" />
        <circle cx="191.9" cy="206.4" r="2.2" fill="#fcf8df" />
        <circle cx="107.8" cy="213.7" r="1.55" fill="#a69aeb" />
        <circle cx="75.2" cy="110.4" r=".85" fill="#7a70c4" opacity=".65" />
      </g>
      <circle cx="93.1" cy="177" r=".75" fill="#8b7aca" opacity=".17" filter="url(#blur1)" />
      <circle cx="141.5" cy="211.1" r=".7" fill="#7a7ba1" opacity=".12" filter="url(#blur1)" />
      <!-- The rear orbit is occluded by the planet. -->
      <use href="#orbitBack" stroke="#a28aee" stroke-width="3.5" opacity=".13" stroke-linecap="round" filter="url(#blur2)" />
      <use href="#orbitBack" stroke="url(#ringBack)" stroke-width="1.9" stroke-linecap="round" filter="url(#softEdge)" />
      <ellipse cx="155" cy="137" rx="77" ry="75" fill="url(#planetAura)" />
      <use href="#globe" fill="#a892ff" opacity=".13" filter="url(#blur5)" />
      <use href="#globe" fill="url(#planetBase)" />
      <g clip-path="url(#globeClip)">
        <path fill="url(#planetWarmth)" d="M99 82h111v110H99z" />
        <path fill="url(#planetLavender)" d="M99 82h111v110H99z" />
        <path fill="url(#planetTopLight)" d="M99 82h111v110H99z" />
        <path fill="url(#planetBottom)" d="M99 82h111v110H99z" />
        <path d="M102.8 119C97.5 146 109.7 174.4 137.6 184.3C158.4 191.9 183.7 180.6 195.1 169.3" stroke="#dbd1ff" stroke-width="3" opacity=".35" filter="url(#blur2)" />
      </g>
      <use href="#globe" stroke="url(#planetRim)" stroke-width="1.1" filter="url(#softEdge)" />
      <path d="M112.2 104.2C124 90.6 139.1 84.4 154.4 84.7C170.2 84.6 183.3 91 192.7 101.1" stroke="#fffbf3" stroke-width="1.05" stroke-linecap="round" opacity=".57" filter="url(#blur1)" />
      <!-- Two gently tilted, ink-blue eyes, with a soft illuminated edge. -->
      <g fill="url(#eyeInk)" stroke="#44456c" stroke-width=".35" filter="url(#eyeEdge)">
        <path d="M129 125.3C133.4 124.1 136 129 137.5 135.5C139.1 142.1 139.3 148.1 135.1 149.2C130.9 150.5 127.9 145.8 126.2 139.1C124.4 132.1 124.6 126.6 129 125.3Z" />
        <path d="M164 115.4C168.4 114.2 171.5 119.2 173 125.9C174.7 132.7 174.7 138.7 170.4 139.8C166.1 141 162.9 136.2 161.3 129.5C159.6 122.5 159.6 116.8 164 115.4Z" />
      </g>
      <!-- A continuous ellipse keeps the crossing and the reflection seamless. -->
      <g clip-path="url(#globeClip)">
        <use href="#orbitFront" transform="translate(0 1.3)" stroke="#7660b6" stroke-width="3" opacity=".12" filter="url(#blur1)" />
      </g>
      <g mask="url(#orbitMask)">
        <use href="#orbitFront" stroke="#ad92ff" stroke-width="6" opacity=".16" stroke-linecap="round" filter="url(#blur5)" />
        <use href="#orbitFront" stroke="url(#ringFront)" stroke-width="4.5" opacity=".26" stroke-linecap="round" filter="url(#blur1)" />
        <use href="#orbitFront" stroke="url(#ringFront)" stroke-width="3.2" stroke-linecap="round" filter="url(#softEdge)" />
        <use href="#orbitFront" stroke="url(#ringCore)" stroke-width="1.35" opacity=".72" stroke-linecap="round" filter="url(#softEdge)" />
      </g>
      <use href="#smallStar" fill="#9986ed" opacity=".35" filter="url(#blur5)" />
      <use href="#smallStar" fill="#c0b4ff" opacity=".36" filter="url(#blur1)" />
      <use href="#smallStar" fill="url(#violetStar)" />
      <path d="M220.6 180.3C220.1 185.4 218.4 187.7 213.2 189" stroke="#ece3ff" stroke-width=".65" opacity=".45" filter="url(#softEdge)" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 14 294 294" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Astral · Helmet — Transparent</title>
  <desc id="desc">淡紫色玻璃宇航头盔、暖白色双眼与四角星。独立矢量 logo，以多层渐变表现半透明外壳、抛光面罩边缘和深色玻璃反射。</desc>

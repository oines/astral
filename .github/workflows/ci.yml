name: Source validation
on:
  pull_request:
    paths-ignore:
      - apps/website/**
      - .github/workflows/website.yml
      - wrangler.jsonc
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-installer:
    name: Windows installer preflight
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - run: node --test scripts/enrollment-installers.test.mjs scripts/desktop-process-identity.test.mjs
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release versions and asset contracts
        run: |
          node scripts/release-version.mjs check
          node scripts/computer-image.mjs verify
          node scripts/check-migrations.mjs
          node scripts/release-check.mjs
          node --test scripts/mac-signing.test.mjs scripts/mac-notarize.test.mjs scripts/mac-credentials.test.mjs scripts/mac-notary-status.test.mjs scripts/release-publish.test.mjs scripts/check-migrations.test.mjs scripts/computer-image.test.mjs scripts/published-desktop-update.test.mjs scripts/desktop-update-fixture.test.mjs scripts/rolling-release-version.test.mjs scripts/build-lib.test.mjs scripts/rolling-release-inputs.test.mjs scripts/desktop-version-acceptance.test.mjs scripts/published-verification-version.test.mjs scripts/rolling-release-package-inputs.test.mjs scripts/rolling-release-tag.test.mjs scripts/rolling-release-workflow.test.mjs
      - name: Check headless installer without installing
        run: |
          bash -n scripts/install-server.sh
          bash scripts/install-server.sh --dry-run
          node --test scripts/install-server.test.mjs scripts/enrollment-installers.test.mjs scripts/desktop-renderer-auth.test.mjs scripts/headless-update-transport.test.mjs
      - run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify generated API and SDK contracts
        run: |
          pnpm openapi-generate
          pnpm sdk-generate
          git diff --exit-code -- spec/openapi/astral.json packages/sdk/src
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: off
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check native enrollment installer preflight
        run: node --test scripts/enrollment-installers.test.mjs scripts/desktop-process-identity.test.mjs
      - run: go test -race -timeout=20m ./...
      - run: go test -v github.com/oines/astral-core/standardtools/... -timeout 4m
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

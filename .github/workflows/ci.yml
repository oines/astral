name: Check and build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.31.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:distribution
      - run: pnpm test:desktop-service
      - run: git diff --exit-code -- spec/openapi/astral.json packages/sdk/src
      - uses: actions/upload-artifact@v4
        with:
          name: astral-server-binaries
          path: dist/bin/
  containers:
    name: Container environment and in-place update
    needs: check
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for the full Ubuntu environment
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker builder prune --force
          df -h /
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          # Do not restore the six-target compile cache into an image-build job.
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: astral-server-binaries
          path: dist/bin/
      - run: go test -tags=integration -count=1 -timeout=20m ./internal/platform
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: package:windows
          - os: ubuntu-latest
            package: package:linux
          - os: macos-14
            package: package:mac-ci
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.31.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go test -race ./...
      - run: go test -v github.com/oines/astral-core/standardtools/... -timeout 4m
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:distribution
      - run: pnpm test:desktop-service
      - name: Native downloaded installer
        run: go test -tags=integration -run '^TestDistributionInstallerRegistersActualDaemon$' -count=1 -timeout=3m ./internal/platform
      - name: Prepare Linux user session for native service test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: pnpm test:daemon-service
      - run: pnpm --filter @astral/desktop ${{ matrix.package }}
      - name: Packaged App startup and shutdown
        if: runner.os != 'Linux'
        run: pnpm test:packaged-desktop
      - name: Packaged Linux App startup and shutdown
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:packaged-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: astral-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

name: Check and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.31.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:distribution
      - run: go test -tags=integration -count=1 -timeout=8m ./internal/platform
      - run: pnpm test:desktop-service
      - run: git diff --exit-code -- spec/openapi/astral.json packages/sdk/src
      - uses: actions/upload-artifact@v4
        with:
          name: astral-server-binaries
          path: dist/bin/
  desktop:
    runs-on: macos-14
    env:
      GOWORK: "off"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.31.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:distribution
      - run: pnpm --filter @astral/desktop package
      - uses: actions/upload-artifact@v4
        with:
          name: astral-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

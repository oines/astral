name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; leave empty to verify all platform packages and native updates without publishing
        required: false
        type: string
  push:
    tags:
      - 'v[0-9]*'

# Mac signing is restricted to the protected mac-signing environment and trusted
# main history. Tagged runs publish only after final package and asset checks.
permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      ci_url: ${{ steps.ci.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Validate existing tag, release version and trusted main history
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tag must be vMAJOR.MINOR.PATCH without leading zeroes or suffixes.'
            exit 1
          fi
          release_sha=$(git rev-parse HEAD)
          if [ -n "$RELEASE_TAG" ]; then
            git show-ref --verify "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$release_sha"
          fi
          git merge-base --is-ancestor "$release_sha" origin/main
          # No script from the selected tag runs before the trusted-history check.
          if [ -n "$RELEASE_TAG" ]; then
            release_version=$(node scripts/release-version.mjs check --tag "$RELEASE_TAG")
          else
            release_version=$(node scripts/release-version.mjs check)
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Verify the pinned public multi-architecture Computer environment
        run: node scripts/computer-image.mjs verify
      - name: Require successful ordinary CI for this exact source commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ci_url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$SOURCE_SHA" --event push --status success --limit 1 --json url --jq '.[0].url // empty')
          if [ -z "$ci_url" ]; then
            echo '::error::No successful main/push CI exists for this source commit. Finish native acceptance before building a candidate.'
            exit 1
          fi
          echo "url=$ci_url" >> "$GITHUB_OUTPUT"

  distribution:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.31.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build six unsigned unified binaries
        run: pnpm build:distribution
      - name: Read current data formats from the built native executable
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/release-version.mjs formats --binary dist/bin/astral-linux-amd64 --sha "$SOURCE_SHA" > dist/bin/release-formats.json
      - name: Include Server and pinned Computer installers
        run: |
          cp scripts/install-server.sh dist/bin/install-server.sh
          cp internal/platform/installers/install.sh dist/bin/install-computer.sh
          cp internal/platform/installers/install.ps1 dist/bin/install-computer.ps1
      - name: Require generated contracts to match committed sources
        run: git diff --exit-code -- spec/openapi/astral.json packages/sdk/src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-distribution
          path: dist/bin/
          if-no-files-found: error
          retention-days: 7

  mac-programs:
    name: Sign Mac unified programs
    needs: [validate, distribution]
    runs-on: macos-15
    timeout-minutes: 20
    environment: mac-signing
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-distribution
          path: dist/bin/
      - run: chmod +x dist/bin/astral-*
      - name: Import personal Developer ID
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/mac-credentials.mjs setup
      - name: Sign standalone Mac programs and refresh all six checksums
        run: node scripts/mac-signing.mjs sign-binaries dist/bin
      - name: Always remove signing credentials
        if: always()
        timeout-minutes: 5
        run: node scripts/mac-credentials.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-distribution
          path: dist/bin/
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Sign Mac packages and report notarization
    needs: [validate, mac-programs]
    runs-on: macos-15
    timeout-minutes: 60
    environment: mac-signing
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.31.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-distribution
          path: dist/bin/
      - run: chmod +x dist/bin/astral-*
      - name: Build Desktop sources before loading credentials
        run: |
          node scripts/build-icons.mjs
          pnpm --filter @astral/desktop exec electron-vite build
      - name: Import personal Developer ID and validate notarization credentials
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/mac-credentials.mjs setup
      - name: Notarize standalone Mac programs
        run: node scripts/mac-notarize.mjs binaries dist/bin
      - name: Package and sign Intel App
        run: pnpm --filter @astral/desktop exec electron-builder --config electron-builder.release.cjs --mac --dir --x64 --publish never
      - name: Notarize and verify final Intel DMG and ZIP
        run: node scripts/mac-notarize.mjs app "$GITHUB_WORKSPACE/apps/desktop/release/mac/Astral.app" x64
      - name: Package and sign Apple Silicon App
        run: pnpm --filter @astral/desktop exec electron-builder --config electron-builder.release.cjs --mac --dir --arm64 --publish never
      - name: Notarize and verify final Apple Silicon DMG and ZIP
        run: node scripts/mac-notarize.mjs app "$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Astral.app" arm64
      - name: Verify signed final bytes and record accepted or pending Apple status
        run: node scripts/mac-notarize.mjs finalize
      - name: Verify actual signed App renderer and titlebar layout
        run: pnpm test:packaged-desktop
      - name: Verify actual signed Desktop replacement and retained data
        run: node scripts/check-desktop-update.mjs
      - name: Always remove signing and notarization credentials
        if: always()
        timeout-minutes: 5
        run: node scripts/mac-credentials.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-desktop-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/mac-signing-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve public Apple submission diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-notarization-diagnostics
          path: apps/desktop/release/notarization/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve native update acceptance output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-update-acceptance-mac
          path: ${{ runner.temp }}/astral-update-acceptance.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve actual Mac titlebar layout screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titlebar-layout-mac
          path: ${{ runner.temp }}/astral-titlebar/*.jpg
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    needs: [validate, mac-programs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package: package:windows
            name: win
          - os: ubuntu-24.04
            package: package:linux
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.31.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-distribution
          path: dist/bin/
      - name: Restore executable permissions after artifact download
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/astral-*
      - name: Package Windows and Linux Desktop files without publishing
        run: pnpm --filter @astral/desktop ${{ matrix.package }} --publish never
      - name: Verify the final Windows ZIP starts and cleans up its processes
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $astralArch = node -p 'process.arch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $astralArchive = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release/Astral-${env:RELEASE_VERSION}-win-$astralArch.zip"
          $astralExtracted = Join-Path $env:RUNNER_TEMP 'astral-release-zip'
          Expand-Archive -LiteralPath $astralArchive -DestinationPath $astralExtracted
          $env:ASTRAL_PACKAGED_APP_EXECUTABLE = Join-Path $astralExtracted 'Astral.exe'
          pnpm test:packaged-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the final native Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          astral_deb_arch=$(dpkg --print-architecture)
          for astral_deb in apps/desktop/release/*.deb; do
            if [ "$(dpkg-deb --field "$astral_deb" Architecture)" = "$astral_deb_arch" ]; then
              sudo apt-get update
              sudo apt-get install --yes "./$astral_deb"
              exit 0
            fi
          done
          echo "::error::No DEB package matches native architecture $astral_deb_arch."
          exit 1
      - name: Verify the installed Linux DEB starts and quits
        if: runner.os == 'Linux'
        env:
          ASTRAL_PACKAGED_APP_EXECUTABLE: /opt/Astral/astral
        run: xvfb-run -a pnpm test:packaged-desktop
      - name: Preserve actual Desktop titlebar layout screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titlebar-layout-${{ matrix.name }}
          path: ${{ runner.temp }}/astral-titlebar/*.jpg
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify actual native Windows NSIS update and retained data
        if: runner.os == 'Windows'
        run: node scripts/check-desktop-update.mjs
      - name: Verify actual native Linux AppImage update and retained data
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The disposable Ubuntu runner must permit the AppImage's Chromium
          # user-namespace sandbox on both launches, including updater relaunch.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          xvfb-run -a node scripts/check-desktop-update.mjs
      - name: Prepare the Linux user manager for final headless acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify final headless programs with real user-service install and recovery
        if: runner.os == 'Linux'
        run: node scripts/check-headless-install.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native update acceptance output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-update-acceptance-${{ matrix.name }}
          path: ${{ runner.temp }}/astral-update-acceptance.log
          if-no-files-found: ignore
          retention-days: 7

  verify-assets:
    name: Verify complete preview inventory and update feeds
    if: needs.validate.outputs.tag == ''
    needs: [validate, mac, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidate-inputs/
      - name: Verify signed candidate bytes, migration metadata and all six update feeds
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          CI_URL: ${{ needs.validate.outputs.ci_url }}
        run: >-
          node scripts/release-assets.mjs candidate --mac-signed
          --input candidate-inputs --output candidate-preview
          --sha "$SOURCE_SHA" --tag "v$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --ci-run-url "$CI_URL"
      - name: Retain the verified preview metadata without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preview-validation
          path: |
            candidate-preview/release-manifest.json
            candidate-preview/release-formats.json
            candidate-preview/mac-signing-report.json
            candidate-preview/latest-*.yml
            candidate-preview/checksums.txt
            candidate-preview/SHA256SUMS
            candidate-preview/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.validate.outputs.tag != ''
    needs: [validate, mac, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    # Different tags can build concurrently, but Latest is selected while this
    # final publication job is serialized and after comparing numeric versions.
    concurrency:
      group: astral-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidate-inputs/
      - name: Assemble the complete public release and final-byte checksums
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CI_URL: ${{ needs.validate.outputs.ci_url }}
        run: >-
          node scripts/release-assets.mjs public --mac-signed
          --input candidate-inputs --output candidate-release
          --sha "$SOURCE_SHA" --tag "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --ci-run-url "$CI_URL"
      - name: Upload and verify every asset before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs --public candidate-release
      - name: Record release capabilities
        run: |
          echo '### Published Astral release' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mac Developer ID signatures, final package bytes and native startup/shutdown are verified. Apple notarization may be pending; see the attached signing report for exact status. Native Windows ZIP and installed Linux DEB passed process lifecycle checks. Windows/Linux packages are unsigned. Desktop update feeds use final-byte SHA-512 and separate architecture channels. Versioned Goose migrations are bundled with the binary.' >> "$GITHUB_STEP_SUMMARY"

  published-desktop-update:
    name: Published Desktop update (${{ matrix.platform }})
    if: needs.validate.outputs.tag != ''
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-2022
            platform: win
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Select the preceding public release by numeric version
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/astral-published-releases.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import path from 'node:path'
          import { compareVersions } from './scripts/release-draft.mjs'
          import { readReleaseVersion, validateVersion } from './scripts/release-version.mjs'
          const current = await readReleaseVersion()
          const releases = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'astral-published-releases.json'), 'utf8')).flat()
          const versions = releases.filter(value => !value.draft && !value.prerelease).flatMap(value => {
            try {
              const version = validateVersion(value.tag_name?.replace(/^v/, ''))
              return value.tag_name === `v${version}` && compareVersions(version, current) < 0 ? [version] : []
            } catch { return [] }
          }).sort(compareVersions)
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${versions.length ? `v${versions.at(-1)}` : ''}\n`)
          JS
      - name: Prepare the disposable Linux desktop session
        if: runner.os == 'Linux' && steps.previous.outputs.tag != ''
        shell: bash
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Update the untouched previous official Mac or Windows installation
        if: runner.os != 'Linux' && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_RELEASE_TAG: ${{ steps.previous.outputs.tag }}
        run: node scripts/check-desktop-update.mjs --published-from "$PREVIOUS_RELEASE_TAG"
        shell: bash
      - name: Update the untouched previous official Linux AppImage
        if: runner.os == 'Linux' && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_RELEASE_TAG: ${{ steps.previous.outputs.tag }}
        run: xvfb-run -a node scripts/check-desktop-update.mjs --published-from "$PREVIOUS_RELEASE_TAG"
      - name: Preserve actual published update evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-desktop-update-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/astral-published-desktop-update.json
            ${{ runner.temp }}/astral-update-acceptance.log
          if-no-files-found: ignore
          retention-days: 14

  published-install:
    name: Verify public VPS installation
    if: needs.validate.outputs.tag != ''
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Prepare a disposable user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"
          test ! -e "$HOME/.config/systemd/user/astral-server.service"
      - name: Download the published installer and verify its checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          astral_asset_url="https://github.com/oines/astral/releases/download/$RELEASE_TAG"
          curl -fsSL --proto '=https' --proto-redir '=https' "$astral_asset_url/SHA256SUMS" -o SHA256SUMS
          curl -fsSL --proto '=https' --proto-redir '=https' "$astral_asset_url/install-server.sh" -o install-server.sh
          python3 - <<'PY'
          import hashlib, pathlib, re
          lines = pathlib.Path('SHA256SUMS').read_text().splitlines()
          matches = [line for line in lines if re.fullmatch(r'[a-f0-9]{64}  install-server\.sh', line)]
          if len(matches) != 1 or hashlib.sha256(pathlib.Path('install-server.sh').read_bytes()).hexdigest() != matches[0].split()[0]:
              raise SystemExit('Published installer checksum does not match SHA256SUMS')
          PY
      - name: Install the actual published distribution as a user service
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/install-server.sh" --tag "$RELEASE_TAG" --root "$RUNNER_TEMP/astral-public-install"
          systemctl --user is-active --quiet astral-server.service
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import path from 'node:path'
          import { readFile } from 'node:fs/promises'
          import { setTimeout as delay } from 'node:timers/promises'
          import { webFixtureCookie } from './scripts/web-auth-fixture.mjs'
          const root = path.join(process.env.RUNNER_TEMP, 'astral-public-install')
          const ready = JSON.parse(await readFile(path.join(root, 'run/ready.json'), 'utf8'))
          const health = await fetch(`${ready.url}/health`, { signal: AbortSignal.timeout(10_000) })
          const status = await health.json()
          assert.equal(status.status, 'ok')
          assert.equal(status.version, process.env.RELEASE_VERSION)
          const cookie = await webFixtureCookie(path.join(root, 'data/server'), ready.url)
          const deadline = Date.now() + 45_000
          for (;;) {
            const response = await fetch(`${ready.url}/api/v1/bootstrap`, { headers: { Cookie: cookie }, signal: AbortSignal.timeout(5000) })
            assert.ok(response.ok, 'Published authenticated Web API failed')
            const bootstrap = await response.json()
            if (bootstrap.computers.some(computer => computer.local && computer.online)) break
            if (Date.now() >= deadline) throw new Error('Published Server did not connect its local Computer')
            await delay(300)
          }
          console.log('Public download, user-service startup, Web administrator login and Local Computer checks passed.')
          JS
      - name: Remove only this test's user service
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          astral_unit="$HOME/.config/systemd/user/astral-server.service"
          if [ -e "$astral_unit" ]; then
            astral_install_root=$(realpath -m "$RUNNER_TEMP/astral-public-install")
            if ! grep -Fxq "# Astral Server installer root: $astral_install_root" "$astral_unit"; then
              echo '::error::The service belongs to another installation; cleanup stopped.'
              exit 1
            fi
            systemctl --user stop astral-server.service
            systemctl --user disable astral-server.service
            rm "$astral_unit"
            systemctl --user daemon-reload
          fi

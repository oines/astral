name: Rolling Release

on:
  workflow_run:
    workflows: [Prepare Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Prepare run before tag creation; use Rerun failed jobs after tagging
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Protect signing, notarization, upload and public-update acceptance together.
# A single pending slot coalesces intermediate requests; no FIFO build backlog.
concurrency:
  group: astral-rolling-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}
      build_metadata_artifact_id: ${{ steps.resolve.outputs.build_metadata_artifact_id }}
      unsigned_artifact_id: ${{ steps.resolve.outputs.unsigned_artifact_id }}
      full_desktop_update: ${{ steps.scope.outputs.full_desktop_update }}
    steps:
      # Resolve using trusted current main before checking out producer code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Validate the wake-up hint without evaluating shell input
        id: producer
        env:
          ASTRAL_BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const value = process.env.ASTRAL_BUILD_RUN_ID
          if (!/^[1-9]\d*$/.test(value || '') || !Number.isSafeInteger(Number(value))) throw new Error('A valid Prepare run ID is required')
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${value}\n`)
          JS
      - name: Resolve trusted source and immutable inputs; discard superseded requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRAL_BUILD_RUN_ID: ${{ steps.producer.outputs.id }}
          ASTRAL_RELEASE_SELECT_LATEST: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/rolling-release-inputs.mjs resolve --output-dir .release-resolution
      - name: Record the selected source or skip reason
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync('.release-resolution/resolution.json', 'utf8'))
          const state = result.eligible ? `Selected ${result.tag}` : `Skipped: ${result.reason || 'superseded'}`
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${state}\n\nPrepare run: ${result.build_run_id}\n\nSource: ${result.source_sha}\n`)
          JS

      - name: Select update verification from the complete published-to-source diff
        if: steps.resolve.outputs.eligible == 'true'
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/astral-release-scope.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import path from 'node:path'
          import { compareVersions } from './scripts/release-draft.mjs'
          import { validateVersion } from './scripts/release-version.mjs'
          const releases = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'astral-release-scope.json'), 'utf8')).flat()
          const versions = releases.filter(value => !value.draft && !value.prerelease).flatMap(value => {
            try {
              const version = validateVersion(value.tag_name?.replace(/^v/, ''))
              return value.tag_name === `v${version}` && compareVersions(version, process.env.RELEASE_VERSION) < 0 ? [version] : []
            } catch { return [] }
          }).sort(compareVersions)
          let base = ''
          if (versions.length) {
            try {
              base = execFileSync('git', ['rev-parse', `refs/tags/v${versions.at(-1)}^{commit}`], { encoding: 'utf8' }).trim()
              execFileSync('git', ['merge-base', '--is-ancestor', base, process.env.SOURCE_SHA], { stdio: 'pipe' })
            } catch { base = '' }
          }
          execFileSync(process.execPath, ['scripts/release-verification-scope.mjs', '--base', base, '--source', process.env.SOURCE_SHA], { stdio: 'inherit' })
          JS

  checks:
    if: needs.validate.outputs.eligible == 'true'
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  mac-programs:
    name: Sign unified Mac programs
    if: needs.validate.outputs.eligible == 'true'
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 20
    environment: mac-signing
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'true'
      GOWORK: 'off'
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Download the once-built unsigned distribution
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate.outputs.unsigned_artifact_id }}
          BUILD_RUN_ID: ${{ needs.validate.outputs.build_run_id }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$BUILD_RUN_ID" --source-sha "$SOURCE_SHA" --output dist/bin
      - run: chmod +x dist/bin/astral-*
      - name: Import Developer ID and Apple credentials
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/mac-credentials.mjs setup
      - name: Sign Darwin programs once and freeze their checksums
        run: node scripts/mac-signing.mjs sign-binaries dist/bin
      - name: Always remove signing and Apple credentials
        if: always()
        timeout-minutes: 5
        run: node scripts/mac-credentials.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: signed-distribution
          path: dist/bin/
          if-no-files-found: error
          retention-days: 14

  mac-binaries-notary:
    name: Notarize unified Mac programs
    needs: [validate, mac-programs]
    runs-on: macos-15-intel
    timeout-minutes: 45
    environment: mac-signing
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'true'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Download the exact signed unified programs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.mac-programs.outputs.artifact_id }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$BUILD_RUN_ID" --output dist/bin
      - name: Restore executable modes
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/astral-*
      - name: Import Developer ID and Apple credentials
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/mac-credentials.mjs setup
      - name: Submit the signed program archive once and wait for its Apple receipt
        run: node scripts/mac-notarize.mjs binaries dist/bin
      - name: Always remove signing and Apple credentials
        if: always()
        timeout-minutes: 5
        run: node scripts/mac-credentials.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-notary-binaries
          path: apps/desktop/release/notarization/binaries.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Apple receipts and original submission bytes on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-notary-binaries
          path: apps/desktop/release/notarization/
          if-no-files-found: ignore
          retention-days: 14

  mac:
    name: Native signed Mac (${{ matrix.arch }})
    needs: [validate, mac-programs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    environment: mac-signing
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'true'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.31.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: pnpm
      - name: Select desktop tool cache directories
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import path from 'node:path'
          for (const [key, directory] of [['electron_config_cache', 'astral-electron-cache'], ['ELECTRON_BUILDER_CACHE', 'astral-electron-builder-cache']]) {
            appendFileSync(process.env.GITHUB_ENV, `${key}=${path.join(process.env.RUNNER_TEMP, directory)}\n`)
          }
          JS
      - name: Cache Electron and packaging tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/astral-electron-cache
            ${{ runner.temp }}/astral-electron-builder-cache
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: desktop-tools-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Download the exact signed unified programs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.mac-programs.outputs.artifact_id }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$BUILD_RUN_ID" --output dist/bin
      - name: Restore executable modes
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/astral-*
      - name: Require the requested native architecture
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: node --input-type=module -e 'if (process.arch !== process.env.NATIVE_ARCH) throw new Error("Native Mac architecture differs")'
      - name: Build Desktop sources
        run: |
          node scripts/build-icons.mjs
          pnpm --filter @astral/desktop exec electron-vite build
      - name: Use TCP for Apple ticket delivery on Intel runners
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          # Hosted runner HTTP/3 workaround: https://github.com/actions/runner-images/issues/14924
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Import Developer ID and Apple credentials
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/mac-credentials.mjs setup
      - name: Package and sign this native App once
        env:
          MAC_ARCH: ${{ matrix.arch }}
        run: pnpm --filter @astral/desktop exec electron-builder --config electron-builder.release.cjs --mac --dir --"$MAC_ARCH" --publish never
      - name: Overlap notarization and old-App preparation, then verify the final update
        if: needs.validate.outputs.full_desktop_update != 'false'
        env:
          MAC_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          astral_app_dir=mac
          if [ "$MAC_ARCH" = arm64 ]; then astral_app_dir=mac-arm64; fi
          node scripts/check-mac-release.mjs "$GITHUB_WORKSPACE/apps/desktop/release/$astral_app_dir/Astral.app" "$MAC_ARCH"
      - name: Notarize and start the actual final Mac package
        if: needs.validate.outputs.full_desktop_update == 'false'
        env:
          MAC_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          astral_app_dir=mac
          if [ "$MAC_ARCH" = arm64 ]; then astral_app_dir=mac-arm64; fi
          node scripts/mac-notarize.mjs app "$GITHUB_WORKSPACE/apps/desktop/release/$astral_app_dir/Astral.app" "$MAC_ARCH"
      - name: Always remove signing and Apple credentials
        if: always()
        timeout-minutes: 5
        run: node scripts/mac-credentials.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-mac-${{ matrix.arch }}
          compression-level: 0
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/notarization/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Apple receipts, submission bytes and native diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-mac-${{ matrix.arch }}
          path: |
            apps/desktop/release/notarization/
            apps/desktop/release/*.dmg
            ${{ runner.temp }}/astral-update-acceptance.log
            ${{ runner.temp }}/astral-titlebar/*.jpg
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Native Desktop (${{ matrix.platform }})
    needs: [validate, mac-programs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package: package:windows
            platform: win
          - os: ubuntu-24.04
            package: package:linux
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      GOWORK: 'off'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.31.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: pnpm
      - name: Select desktop tool cache directories
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import path from 'node:path'
          for (const [key, directory] of [['electron_config_cache', 'astral-electron-cache'], ['ELECTRON_BUILDER_CACHE', 'astral-electron-builder-cache']]) {
            appendFileSync(process.env.GITHUB_ENV, `${key}=${path.join(process.env.RUNNER_TEMP, directory)}\n`)
          }
          JS
      - name: Cache Electron and packaging tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/astral-electron-cache
            ${{ runner.temp }}/astral-electron-builder-cache
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: desktop-tools-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Download the exact signed unified programs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.mac-programs.outputs.artifact_id }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$BUILD_RUN_ID" --output dist/bin
      - name: Restore executable modes
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/astral-*
      # The locked builder otherwise uses LZMA level 9 for each NSIS payload,
      # including the disposable old-version fixture. Keep the same installer
      # format and verification, but prioritize release latency over size.
      - name: Select fast Windows package compression
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'ELECTRON_BUILDER_COMPRESSION_LEVEL=1' >> "$GITHUB_ENV"
      - name: Package the final Windows or Linux Desktop files once
        env:
          PACKAGE_SCRIPT: ${{ matrix.package }}
        shell: bash
        run: pnpm --filter @astral/desktop "$PACKAGE_SCRIPT" --publish never
      # The CLI installation index aliases the native profile on Windows.
      # Complete replacement acceptance before running the service checks.
      - name: Verify native Windows NSIS replacement and retained data
        if: runner.os == 'Windows' && needs.validate.outputs.full_desktop_update != 'false'
        run: node scripts/check-desktop-update.mjs
      - name: Verify the final Windows ZIP lifecycle and versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $astralArch = node -p 'process.arch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $astralArchive = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release/Astral-${env:ASTRAL_RELEASE_VERSION}-win-$astralArch.zip"
          $astralExtracted = Join-Path $env:RUNNER_TEMP 'astral-release-zip'
          Expand-Archive -LiteralPath $astralArchive -DestinationPath $astralExtracted
          $env:ASTRAL_PACKAGED_APP_EXECUTABLE = Join-Path $astralExtracted 'Astral.exe'
          pnpm test:packaged-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify headless installation and recovery before registering the DEB
        if: runner.os == 'Linux'
        run: node scripts/check-headless-install.mjs
      - name: Install the final native DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          astral_deb_arch=$(dpkg --print-architecture)
          for astral_deb in apps/desktop/release/*.deb; do
            if [ "$(dpkg-deb --field "$astral_deb" Architecture)" = "$astral_deb_arch" ]; then
              sudo apt-get update
              sudo apt-get install --yes "./$astral_deb"
              exit 0
            fi
          done
          exit 1
      - name: Verify the installed Linux DEB lifecycle and versions
        if: runner.os == 'Linux'
        env:
          ASTRAL_PACKAGED_APP_EXECUTABLE: /opt/Astral/astral
        run: xvfb-run -a pnpm test:packaged-desktop
      - name: Verify native Linux AppImage replacement and retained data
        if: runner.os == 'Linux' && needs.validate.outputs.full_desktop_update != 'false'
        shell: bash
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          xvfb-run -a node scripts/check-desktop-update.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-desktop-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/astral-update-acceptance.log
            ${{ runner.temp }}/astral-titlebar/*.jpg
            ${{ runner.temp }}/astral-handles.txt
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: Native program lifecycle (${{ matrix.os }})
    needs: [validate, mac-programs]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.31.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the exact signed unified programs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.mac-programs.outputs.artifact_id }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$BUILD_RUN_ID" --output dist/bin
      - name: Restore executable modes
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/astral-*
      # Isolated runners avoid the CLI/Desktop profile alias while these
      # checks overlap App packaging, notarization and replacement acceptance.
      - uses: ./.github/actions/native-release-checks

  containers:
    name: Real container environment and in-place update
    needs: [validate, mac-programs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Download the exact signed unified programs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.mac-programs.outputs.artifact_id }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$BUILD_RUN_ID" --output dist/bin
      - name: Restore executable modes
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/astral-*
      - name: Reserve space for the pinned environment
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker builder prune --force
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: true
      - name: Verify both real container lifecycle scenarios
        run: go test -tags=integration -count=1 -timeout=20m -run '^TestContainer(ShortcutAndInstallerUseIndependentRealComputers|UpdateKeepsContainerAndInstalledEnvironment)$' ./internal/platform

  seal:
    name: Seal the verified final bytes
    needs: [validate, checks, mac-programs, mac-binaries-notary, mac, desktop, native, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.seal.outputs.bundle_sha256 }}
      inputs_sha256: ${{ steps.seal.outputs.inputs_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Download only the exact successful package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rolling-release-package-inputs.mjs
      - name: Gather both native Mac reports without accessing signing credentials
        run: |
          node scripts/mac-notarize.mjs finalize release-inputs/signed-distribution
          cp apps/desktop/release/mac-signing-report.json release-inputs/mac-signing-report.json
      - name: Assemble the complete release bundle once
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          BUILD_RUN_ID: ${{ needs.validate.outputs.build_run_id }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          node scripts/release-assets.mjs public --mac-signed
          --input release-inputs --output sealed-release
          --build-metadata .release-metadata/release-build.json
          --sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --ci-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Seal final metadata and immutable original artifact references
        id: seal
        run: node scripts/sealed-release-inputs.mjs seal sealed-release sealed-metadata
      - name: Sign the immutable release index using the CI identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            sealed-metadata/SHA256SUMS
            sealed-metadata/package-inputs.json
          predicate-type: https://astral.oines.dev/attestations/release/v1
          predicate-path: sealed-metadata/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: sealed-release
          compression-level: 0
          path: sealed-metadata/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Promote the sealed release
    needs: [validate, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      attestations: read
    concurrency:
      group: astral-release-publication
      cancel-in-progress: false
    env:
      ASTRAL_RELEASE_BUNDLE_SHA256: ${{ needs.seal.outputs.bundle_sha256 }}
      ASTRAL_RELEASE_INPUTS_SHA256: ${{ needs.seal.outputs.inputs_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Download the sealed bundle by its immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.seal.outputs.artifact_id }}
        run: node scripts/rolling-release-inputs.mjs download --artifact-id "$ARTIFACT_ID" --run-id "$GITHUB_RUN_ID" --output sealed-metadata
      - name: Verify the CI signatures on the index and original artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for astral_subject in SHA256SUMS package-inputs.json; do
            gh attestation verify "sealed-metadata/$astral_subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --predicate-type https://astral.oines.dev/attestations/release/v1
          done
      - name: Restore the same final bytes from their original immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sealed-release-inputs.mjs restore sealed-metadata sealed-release
      - name: Create the source tag without starting another build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rolling-release-tag.mjs sealed-release
      - name: Upload, verify and atomically publish these same bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs --public sealed-release

  published-desktop-update:
    name: Published Desktop update (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Require the native verification architecture
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: node --input-type=module -e 'if (process.arch !== process.env.NATIVE_ARCH) throw new Error("Published update architecture differs")'
      - name: Select the preceding public release by numeric version
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/astral-published-releases.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import path from 'node:path'
          import { compareVersions } from './scripts/release-draft.mjs'
          import { readReleaseVersion, validateVersion } from './scripts/release-version.mjs'
          const current = await readReleaseVersion()
          const releases = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'astral-published-releases.json'), 'utf8')).flat()
          const versions = releases.filter(value => !value.draft && !value.prerelease).flatMap(value => {
            try {
              const version = validateVersion(value.tag_name?.replace(/^v/, ''))
              return value.tag_name === `v${version}` && compareVersions(version, current) < 0 ? [version] : []
            } catch { return [] }
          }).sort(compareVersions)
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${versions.length ? `v${versions.at(-1)}` : ''}\n`)
          JS
      - name: Prepare the disposable Linux desktop session
        if: runner.os == 'Linux' && steps.previous.outputs.tag != ''
        shell: bash
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Update the untouched previous official Mac or Windows installation
        if: runner.os != 'Linux' && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_RELEASE_TAG: ${{ steps.previous.outputs.tag }}
        run: node scripts/check-desktop-update.mjs --published-from "$PREVIOUS_RELEASE_TAG"
        shell: bash
      - name: Update the untouched previous official Linux AppImage
        if: runner.os == 'Linux' && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_RELEASE_TAG: ${{ steps.previous.outputs.tag }}
        run: xvfb-run -a node scripts/check-desktop-update.mjs --published-from "$PREVIOUS_RELEASE_TAG"
      - name: Preserve actual published update evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-desktop-update-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/astral-published-desktop-update.json
            ${{ runner.temp }}/astral-update-acceptance.log
          if-no-files-found: ignore
          retention-days: 14

  published-install:
    name: Verify public VPS installation
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          metadata-artifact-id: ${{ needs.validate.outputs.build_metadata_artifact_id }}
          build-run-id: ${{ needs.validate.outputs.build_run_id }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
      - name: Prepare a disposable user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"
          test ! -e "$HOME/.config/systemd/user/astral-server.service"
      - name: Download the published installer and verify its checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          astral_asset_url="https://github.com/oines/astral/releases/download/$RELEASE_TAG"
          curl -fsSL --proto '=https' --proto-redir '=https' "$astral_asset_url/SHA256SUMS" -o SHA256SUMS
          curl -fsSL --proto '=https' --proto-redir '=https' "$astral_asset_url/install-server.sh" -o install-server.sh
          python3 - <<'PY'
          import hashlib, pathlib, re
          lines = pathlib.Path('SHA256SUMS').read_text().splitlines()
          matches = [line for line in lines if re.fullmatch(r'[a-f0-9]{64}  install-server\.sh', line)]
          if len(matches) != 1 or hashlib.sha256(pathlib.Path('install-server.sh').read_bytes()).hexdigest() != matches[0].split()[0]:
              raise SystemExit('Published installer checksum does not match SHA256SUMS')
          PY
      - name: Install the actual published distribution as a user service
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          astral_password_file=$(mktemp "$RUNNER_TEMP/astral-admin-password.XXXXXX")
          chmod 600 "$astral_password_file"
          printf '%s\n' 'Astral-disposable-CI-password-42!' > "$astral_password_file"
          trap 'rm -f "$astral_password_file"' EXIT
          export ASTRAL_ADMIN_USERNAME=ci-administrator ASTRAL_ADMIN_PASSWORD_FILE="$astral_password_file"
          bash "$RUNNER_TEMP/install-server.sh" --tag "$RELEASE_TAG" --root "$RUNNER_TEMP/astral-public-install"
          test "$(astral version)" = "$RELEASE_VERSION"
          systemctl --user is-active --quiet astral-server.service
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import path from 'node:path'
          import { readFile } from 'node:fs/promises'
          import { setTimeout as delay } from 'node:timers/promises'
          import { webFixtureCookie } from './scripts/web-auth-fixture.mjs'
          const root = path.join(process.env.RUNNER_TEMP, 'astral-public-install')
          const ready = JSON.parse(await readFile(path.join(root, 'run/ready.json'), 'utf8'))
          const health = await fetch(`${ready.url}/health`, { signal: AbortSignal.timeout(10_000) })
          const status = await health.json()
          assert.equal(status.status, 'ok')
          assert.equal(status.version, process.env.RELEASE_VERSION)
          const cookie = await webFixtureCookie(path.join(root, 'data/server'), ready.url)
          const deadline = Date.now() + 45_000
          for (;;) {
            const response = await fetch(`${ready.url}/api/v1/bootstrap`, { headers: { Cookie: cookie }, signal: AbortSignal.timeout(5000) })
            assert.ok(response.ok, 'Published authenticated Web API failed')
            const bootstrap = await response.json()
            if (bootstrap.computers.some(computer => computer.local && computer.online)) break
            if (Date.now() >= deadline) throw new Error('Published Server did not connect its local Computer')
            await delay(300)
          }
          console.log('Public download, user-service startup, Web administrator login and Local Computer checks passed.')
          JS
      - name: Remove only this test's user service
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          astral_unit="$HOME/.config/systemd/user/astral-server.service"
          if [ -e "$astral_unit" ]; then
            astral_install_root=$(realpath -m "$RUNNER_TEMP/astral-public-install")
            if ! grep -Fxq "# Astral Server installer root: $astral_install_root" "$astral_unit"; then
              echo '::error::The service belongs to another installation; cleanup stopped.'
              exit 1
            fi
            systemctl --user stop astral-server.service
            systemctl --user disable astral-server.service
            rm "$astral_unit"
            systemctl --user daemon-reload
          fi
